<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Profit Calculator</title>
<style>
  :root{
    --bg:#3d3d3d;
    --card:#2a2a2a;
    --accent:#d2a679;
    --accent2:#f59e0b;
    --text:#f5f0e6;
    --muted:#b3b3b3;
    --profit:#4ade80;
    --loss:#f87171;
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
  }
  body{
    margin:0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #3d3d3d;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    overflow:hidden;
  }
  .wrap{
    width:100%;
    max-width:520px;
    max-height:100%;
    display:flex;
    flex-direction:column;
  }
  .card{
    background:var(--card);
    border-radius:18px;
    padding:22px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    overflow-y:auto;
    max-height:calc(100vh - 70px);
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .card::-webkit-scrollbar{
    display:none;
  }
  h1{
    font-size:20px;
    margin:0 0 4px;
    color:var(--text);
    text-align:center;
  }
  p.sub{
    text-align:center;
    color:var(--muted);
    margin:0 0 16px;
    font-size:13px;
  }
  .field{
    margin-bottom:12px;
  }
  label{
    display:block;
    font-size:14px;
    font-weight:600;
    color:var(--text);
    margin-bottom:6px;
  }
  .hint{
    font-size:12px;
    color:var(--muted);
    font-weight:400;
    margin-inline-start:4px;
  }
  input[type="number"]{
    width:100%;
    padding:10px 12px;
    border:1.5px solid #3a3a3a;
    border-radius:10px;
    font-size:14px;
    outline:none;
    transition:border-color .15s;
    background:#1a1a1a;
    color:#f5f0e6;
  }
  input[type="number"]::placeholder{
    color:#888888;
  }
  input[type="number"]:focus{
    border-color:var(--accent);
  }
  .results{
    margin-top:16px;
    padding-top:14px;
    border-top:1.5px dashed #3a3a3a;
  }
  .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 0;
    font-size:14px;
    color:var(--text);
  }
  .row .val{
    font-weight:700;
  }
  .row.total{
    margin-top:4px;
    padding:12px 14px;
    background:#1a1a1a;
    border-radius:12px;
    font-size:15px;
  }
  .row.total .val{
    font-size:18px;
  }
  .profit{color:#7fffb0;}
  .loss{color:#ff9b9b;}
  .badge{
    display:inline-block;
    margin-top:14px;
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    text-align:center;
    width:100%;
  }
  .badge.profit-bg{
    background:#dcfce7;
    color:#166534;
  }
  .badge.loss-bg{
    background:#fee2e2;
    color:#991b1b;
  }
  footer{
    text-align:center;
    color:#a0a0a0;
    font-size:11px;
    margin-top:10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Profit Calculator</h1>
    <p class="sub">Enter product cost, sell price and box price to calculate profit</p>

    <div class="field">
      <label>Product Cost (per unit) <span class="hint">— cost of one product</span></label>
      <input type="number" id="cost" placeholder="How much does one unit cost you?" step="0.01">
    </div>

    <div class="field">
      <label>Sell Price (per unit) <span class="hint">— selling price of one product</span></label>
      <input type="number" id="sell" placeholder="What will you sell it for?" step="0.01">
    </div>

    <div class="field">
      <label>Products per Box <span class="hint">— how many products in one box</span></label>
      <input type="number" id="qty" placeholder="How many fit in a box?" step="1">
    </div>

    <div class="field">
      <label>Box Price <span class="hint">— extra packing/box cost (optional)</span></label>
      <input type="number" id="boxPrice" placeholder="Any extra packing cost?" step="0.01">
    </div>

    <div class="results" id="results" style="display:none;">
      <div class="row">
        <span>Profit per Product</span>
        <span class="val" id="profitPerUnit">-</span>
      </div>
      <div class="row">
        <span>Total Cost per Box (products + box price)</span>
        <span class="val" id="totalCostPerBox">-</span>
      </div>
      <div class="row">
        <span>Total Sale per Box</span>
        <span class="val" id="totalSalePerBox">-</span>
      </div>
      <div class="row total">
        <span>Profit per Box</span>
        <span class="val" id="profitPerBox">-</span>
      </div>
      <div class="badge" id="badge"></div>
    </div>
  </div>
  <footer>Results update automatically as you type</footer>
</div>

<script>
  const ids = ["cost","sell","qty","boxPrice"];
  const results = document.getElementById("results");

  function fmt(n){
    if (isNaN(n)) return "-";
    const sign = n < 0 ? "-" : "";
    return sign + "$" + Math.abs(n).toLocaleString('en-US', {maximumFractionDigits:2, minimumFractionDigits:2});
  }

  function calculate(){
    const cost = parseFloat(document.getElementById("cost").value);
    const sell = parseFloat(document.getElementById("sell").value);
    const qty = parseFloat(document.getElementById("qty").value);
    const boxPrice = parseFloat(document.getElementById("boxPrice").value) || 0;

    if (isNaN(cost) || isNaN(sell) || isNaN(qty) || qty <= 0){
      results.style.display = "none";
      return;
    }

    results.style.display = "block";

    const profitPerUnit = sell - cost;
    const totalCostPerBox = (cost * qty) + boxPrice;
    const totalSalePerBox = sell * qty;
    const profitPerBox = totalSalePerBox - totalCostPerBox;

    document.getElementById("profitPerUnit").textContent = fmt(profitPerUnit);
    document.getElementById("totalCostPerBox").textContent = fmt(totalCostPerBox);
    document.getElementById("totalSalePerBox").textContent = fmt(totalSalePerBox);

    const profitBoxEl = document.getElementById("profitPerBox");
    profitBoxEl.textContent = fmt(profitPerBox);
    profitBoxEl.className = "val " + (profitPerBox >= 0 ? "profit" : "loss");

    const badge = document.getElementById("badge");
    if (profitPerBox >= 0){
      badge.textContent = "You're Making a Profit";
      badge.className = "badge profit-bg";
    } else {
      badge.textContent = "You're Making a Loss";
      badge.className = "badge loss-bg";
    }
  }

  ids.forEach(id => {
    document.getElementById(id).addEventListener("input", calculate);
  });
</script>
</body>
</html>
